---
# yamllint disable
# Configuration for MegaLinter
# MegaLinter Configuration File
# https://megalinter.io

# Configuration globale
SHOW_ELAPSED_TIME: true

# MegaLinter will report issues but will not fail the CI build.
# This prevents pre-existing errors from blocking PRs.
DISABLE_ERRORS: true

# Désactiver les linters générant des faux positifs fréquents
DISABLE:
  - SPELL # Désactive le dictionnaire (jargon technique et français)
  - COPYPASTE # Désactive le détecteur de duplication (normal pour les cours et labs)
  - SECRET # Désactive la détection de secrets (déjà gérée par trufflehog)

DISABLE_LINTERS:
  - YAML_V8R
  - REPOSITORY_DEVSKIM
  - MARKDOWN_MARKDOWN_LINK_CHECK

# Ignorer les dossiers lourds et scanner uniquement les fichiers modifiés (MR) pour une exécution ultra-rapide (<10s)
EXCLUDED_DIRECTORIES:
  - fdroid_data_repo
  - landing_page
  - build
  - .dart_tool

VALIDATE_ALL_CODEBASE: false

FILTER_REGEX_EXCLUDE: (fdroid_data_repo/.*|landing_page/.*|scripts/translate_.*)


