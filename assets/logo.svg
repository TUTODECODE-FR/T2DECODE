<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Rounded cream background box -->
  <rect x="0" y="0" width="100" height="100" rx="22" ry="22" fill="#F5EBDA"/>
  
  <!-- Hexagon Outline -->
  <polygon points="50,18 78,34 78,66 50,82 22,66 22,34" fill="none" stroke="#000000" stroke-width="3.5" stroke-linejoin="round"/>
  
  <!-- 6 Hexagon Nodes (alternating filled black / hollow white) -->
  <circle cx="50" cy="18" r="5.5" fill="#F5EBDA" stroke="#000000" stroke-width="3"/>
  <circle cx="78" cy="34" r="5.5" fill="#000000"/>
  <circle cx="78" cy="66" r="5.5" fill="#F5EBDA" stroke="#000000" stroke-width="3"/>
  <circle cx="50" cy="82" r="5.5" fill="#000000"/>
  <circle cx="22" cy="66" r="5.5" fill="#F5EBDA" stroke="#000000" stroke-width="3"/>
  <circle cx="22" cy="34" r="5.5" fill="#000000"/>

  <!-- Center Offline Cloud with Slash -->
  <path d="M 37 57 A 7 7 0 0 1 37 45 A 10 10 0 0 1 52 41 A 10 10 0 0 1 65 47 A 7 7 0 0 1 63 57 Z" fill="#F5EBDA" stroke="#000000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="39" y1="60" x2="61" y2="40" stroke="#000000" stroke-width="3.8" stroke-linecap="round"/>
</svg>