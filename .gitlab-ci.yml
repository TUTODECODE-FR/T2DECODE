image: ghcr.io/cirruslabs/flutter:stable

variables:
  GIT_DEPTH: "0"
  DS_EXCLUDED_PATHS: "android/**,ios/**,macos/**,windows/**,linux/**"

default:
  interruptible: false

stages:
  - validate
  - test
  - build-test
  - auto-tag
  - sync-os-builds
  - release

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .pub-cache/global_packages

# Chemins « code » : les MR docs-only (claims bénévoles, README…) sautent les
# jobs lourds (flutter test/analyze) — pipeline de claim verte en ~1 minute.
.code-change-paths: &code-change-paths
  - lib/**/*
  - test/**/*
  - pubspec.yaml
  - pubspec.lock
  - analysis_options.yaml
  - scripts/**/*
  - ci_scripts/**/*
  - android/**/*
  - ios/**/*
  - macos/**/*
  - windows/**/*
  - linux/**/*
  - web/**/*
  - .gitlab-ci.yml

# Règles « MR code-only » : auto si du code change, sinon manuel (non bloquant).
.mr-code-rules: &mr-code-rules
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    changes: *code-change-paths
    when: on_success
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    when: manual
    allow_failure: true

# === STAGE: VALIDATE ===
dco_check:
  stage: validate
  image:
    name: alpine/git
    entrypoint: [""]
  script:
    - echo "Checking commits for DCO (Signed-off-by) signature..."
    - MISSING_DCO=0
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - TARGET_BRANCH="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-main}"
    - git fetch origin "$TARGET_BRANCH" || true
    - |
      COMMITS=$(git rev-list "origin/$TARGET_BRANCH..HEAD" 2>/dev/null || git log -n 5 --format=%H)
      for commit in $COMMITS; do
        if ! git log -1 --format=%B "$commit" | grep -qi "Signed-off-by:"; then
          echo "❌ Error: Commit $commit is missing the 'Signed-off-by:' line."
          MISSING_DCO=1
        else
          echo "✅ Commit $commit is signed."
        fi
      done
    - |
      if [ $MISSING_DCO -eq 1 ]; then
        echo "Please amend your commits with 'git commit --amend -s' and force push."
        exit 1
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PROJECT_PATH != $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success

# === CLAIMS BÉNÉVOLES EN LIBRE-SERVICE ===
# Une MR « prendre #<iid> » OUVERTE verrouille le ticket immédiatement :
# pipeline verte = le ticket est à vous (aucune action mainteneur requise).
# Ce job est en lecture seule (aucun secret) ; le bot planifié merge.
volunteer_claim_validate:
  stage: validate
  image: python:3.12-alpine
  variables:
    # Projet canonique (les pipelines de fork tournent avec l'ID du fork)
    VOLUNTEER_PROJECT: "tutodecode-org/T2DECODE"
  before_script:
    - apk add --no-cache git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git fetch origin "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-main}" || true
  script:
    - python3 scripts/test_volunteer_claim.py
    - python3 scripts/volunteer_claim_apply.py --mode validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success

# Bot bénévole (pipeline planifiée sur main, ex. toutes les 15 min) :
# revalide chaque MR de claim ouverte, assigne l'issue tout de suite
# (assignee + label en-cours), merge les MR valides sans intervention,
# commente les invalides, ferme les claims inactives (14 j) et libère
# les tickets abandonnés. Nécessite la variable protégée
# PROJECT_ACCESS_TOKEN (scope api) — jamais exposée aux pipelines de MR.
volunteer_claim_bot:
  stage: validate
  image: python:3.12-alpine
  variables:
    VOLUNTEER_PROJECT: "tutodecode-org/T2DECODE"
  script:
    - python3 scripts/volunteer_claim_apply.py --mode bot
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "main"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main" && $VOLUNTEER_BOT == "1"'
      when: on_success

test_and_analyze:
  stage: validate
  script:
    - flutter pub get
    - python3 scripts/verify_checksums.py
    - python3 scripts/audit_airgap_leak.py
    - python3 scripts/audit_binary_hardening.py
    - python3 scripts/generate_sbom.py
    - flutter pub outdated || true
    - flutter analyze --no-fatal-infos --no-fatal-warnings || true
    - flutter test --coverage --dart-define=SKIP_GOLDENS=true
    - python3 scripts/verify_coverage.py coverage/lcov.info || true
    - python3 scripts/check_dependency_confusion.py
    - |
      # Enhanced Secrets & Private Key Scan
      if grep -rE "(AKIA[0-9A-Z]{16}|GH[A-Za-z0-9_]{36,40}|SG\.[A-Za-z0-9_-]{22}\.[A-Za-z0-9_-]{43}|sk_live_[0-9a-zA-Z]{24}|AIza[0-9A-Za-z-_]{35}|xox[baprs]-[0-9a-zA-Z]{10,48}|-----BEGIN [A-Z ]*PRIVATE KEY-----)" . \
        --exclude-dir=".git" --exclude-dir=".dart_tool" --exclude-dir="build" \
        --exclude-dir=".github/workflows" --exclude-dir="fdroid_data_repo" \
        --exclude=".gitlab-ci.yml" --exclude="payload.json" \
        --binary-files=without-match; then
        echo "❌ Error: Hardcoded secrets or private keys found!"
        exit 1
      else
        echo "✅ Enhanced secrets scan passed."
      fi
    - |
      # Supply Chain & HTTP Dependency Check
      if grep -q "url: \"http://" pubspec.lock 2>/dev/null; then
        echo "❌ Error: Insecure HTTP dependency source found in pubspec.lock!"
        exit 1
      else
        echo "✅ Supply chain HTTPS check passed."
      fi
    - |
      # Dangerous Android Permissions Audit
      if grep -qE "(RECEIVE_SMS|READ_SMS|SEND_SMS|CALL_PHONE|PROCESS_OUTGOING_CALLS|SYSTEM_ALERT_WINDOW|BIND_ACCESSIBILITY_SERVICE)" android/app/src/main/AndroidManifest.xml 2>/dev/null; then
        echo "❌ Error: High-risk/dangerous permission detected in AndroidManifest.xml!"
        exit 1
      else
        echo "✅ Android permissions security check passed."
      fi
  rules: *mr-code-rules

airgap_leak_canary:
  stage: validate
  script:
    - python3 scripts/audit_airgap_leak.py
  rules: *mr-code-rules

binary_hardening_audit:
