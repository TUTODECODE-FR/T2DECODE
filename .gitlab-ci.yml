zero_trust_tamper_defense:
  stage: validate
  script:
    - echo "🛡️ Running Military-Grade Zero-Trust Asset & Bidi Attack Audit..."
    - python3 scripts/verify_checksums.py
    - |
      # CVE-2021-42574 Trojan Source / Unicode Bidi Attack Scan
      if grep -rnU $'\u202A\|\u202B\|\u202D\|\u202E\|\u2066\|\u2067\|\u2068\|\u202C\|\u2069' lib/ scripts/; then
        echo "❌ CRITICAL SECURITY ERROR: Invisible Trojan Source / Bidi character attack detected!"
        exit 1
      else
        echo "✅ Zero-Trust Bidi Attack & Asset Integrity Audit PASSED."
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PROJECT_PATH != $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success

military_hardening_audit:
  stage: validate
  script:
    - echo "🛡️ Running Military-Grade Code Hardening & Unsafe Execution Audit..."
    - |
      UNSAFE_EXEC=0
      # Audit for raw shell calls with dynamic interpolation
      if grep -rE "Process\.run\(['\"](sh|bash|zsh|cmd|powershell)" lib/ \
        --binary-files=without-match; then
        echo "⚠️ Warning: Raw shell process execution detected in lib/. Verify argument sanitization."
      fi
      # Audit for unsafe C/C++ memory functions if C/C++ code is present
      if grep -rE "\b(strcpy|strcat|sprintf|gets)\b" linux/ windows/ macos/ 2>/dev/null; then
        echo "❌ CRITICAL SECURITY ERROR: Unsafe C/C++ memory functions (strcpy/sprintf/gets) detected!"
        UNSAFE_EXEC=1
      fi
      if [ $UNSAFE_EXEC -eq 1 ]; then
        exit 1
      else
        echo "✅ Military-Grade Hardening Audit PASSED."
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PROJECT_PATH != $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success

# === STAGE: BUILD-TEST ===
build_android_test:
  stage: build-test
  script:
    - flutter pub get
    - flutter build apk --release
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PROJECT_PATH != $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - lib/**/*
        - pubspec.yaml
        - pubspec.lock
        - android/**/*
        - linux/**/*
        - windows/**/*
        - macos/**/*
        - ios/**/*
      when: on_success
    # Docs-only and volunteer-claim MRs do not match the paths above.
    # rules:when:manual is blocking unless allow_failure is true, so a
    # fallback manual job never finishes and fails "Pipelines must succeed".
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never

build_linux_test:
  stage: build-test
  script:
    - |
      if ! command -v clang >/dev/null 2>&1; then
        echo "Linux build tools not pre-installed. Installing dependencies..."
        sudo apt-get update -y
        sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev
      fi
    - flutter pub get
    - flutter build linux --release
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PROJECT_PATH != $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - lib/**/*
        - pubspec.yaml
        - pubspec.lock
        - android/**/*
        - linux/**/*
        - windows/**/*
        - macos/**/*
        - ios/**/*
      when: on_success
    # Same as build_android_test: do not leave a blocking manual job
    # when the merge request does not touch build inputs.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never

# === STAGE: VOLUNTEER CLAIM APPLY (main after merge of prendre #N) ===
volunteer_claim_apply:
  stage: auto-tag
  image: python:3.12-alpine
  before_script:
    - apk add --no-cache git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git fetch origin main || true
  script:
    - python3 scripts/volunteer_claim_apply.py --mode apply
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
      when: on_success

# === STAGE: AUTO-TAG ===
auto_tag:
  stage: auto-tag
  image:
    name: alpine/git
    entrypoint: [""]
  script:
    - CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r HEAD)
    - echo "Changed files in commit:"
    - echo "$CHANGED_FILES"
    - NON_DOC_CHANGES=$(echo "$CHANGED_FILES" | grep -vE '\.(md|png|jpg|jpeg|svg)$|^docs/|^\.gitignore$|^LICENSE$|^AGENTS\.md$' || true)
    - |
      if [ -z "$NON_DOC_CHANGES" ]; then
        echo "Only documentation, asset, or metadata files were modified. Skipping automated release tag creation."
        exit 0
      fi
    - VERSION_LINE=$(grep '^version:' pubspec.yaml)
    - BASE_VERSION=$(echo "$VERSION_LINE" | cut -d' ' -f2 | cut -d'+' -f1)
    - echo "Base version $BASE_VERSION"
    - MATCHING_TAGS=$(git tag -l "v$BASE_VERSION.*")
    - |
      if [ -z "$MATCHING_TAGS" ]; then
        NEXT_TAG="v$BASE_VERSION.1"
      else
        LATEST_SUFFIX=$(echo "$MATCHING_TAGS" | grep -E "^v$BASE_VERSION\.[0-9]+$" | sed "s/^v$BASE_VERSION\.//" | sort -n | tail -n1)
        if [ -z "$LATEST_SUFFIX" ]; then
          NEXT_TAG="v$BASE_VERSION.1"
        else
          NEXT_SUFFIX=$((LATEST_SUFFIX + 1))
          NEXT_TAG="v$BASE_VERSION.$NEXT_SUFFIX"
        fi
      fi
    - echo "Determined next tag $NEXT_TAG"
    - git config user.name "gitlab-ci[bot]"
    - git config user.email "gitlab-ci[bot]@tutodecode.org"
    - git config remote.origin.url "https://oauth2:${PROJECT_ACCESS_TOKEN:-$CI_JOB_TOKEN}@gitlab.com/$CI_PROJECT_PATH.git"
    - git tag -a "$NEXT_TAG" -m "Automated release tag $NEXT_TAG"
    - git push origin "$NEXT_TAG"
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE != "schedule"

# === STAGE: BUILD-RELEASE (Offloaded to GitHub Actions + Local fetch) ===
# === STAGE: SYNC-OS-BUILDS (Unified multi-OS recovery from GitHub Actions) ===
sync_github_multi_os_builds:
  stage: sync-os-builds
  image: alpine:latest
  allow_failure: true
  script:
    - apk add --no-cache curl bash
    - 'TAG="${CI_COMMIT_TAG:-v$(grep "^version:" pubspec.yaml | cut -d " " -f 2 | cut -d "+" -f 1)}"'
    - 'echo "=========================================================="'
    - 'echo "🔄 Récupération et vérification des builds multi-OS depuis GitHub"'
    - 'echo "🎯 Version ciblée: $TAG"'
    - 'echo "=========================================================="'
    - mkdir -p github_assets
    - 'BASE="https://github.com/TUTODECODE-FR/T2DECODE/releases/download/${TAG}"'
    - |
      echo "⏳ En attente de la fin de compilation multi-OS sur GitHub Actions..."
      for i in $(seq 1 60); do
        if curl -fsSL -I "$BASE/T2DECODE-macOS.dmg" >/dev/null 2>&1; then
          echo "✅ Les binaires multi-OS sont prêts et publiés sur GitHub !"
          break
        fi
        echo "Compilation en cours sur GitHub (Android, macOS, Windows, Linux, Snap)... Attente ($i/60)..."
        sleep 10
      done
    - |
      for F in \
        "app-arm64-v8a-release.apk" \
        "app-armeabi-v7a-release.apk" \
        "app-x86_64-release.apk" \
        "T2DECODE-Linux.tar.gz" \
        "T2DECODE-Windows.zip" \
        "T2DECODE-macOS.dmg" \
        "T2DECODE-macOS.zip" \
        "sbom-cyclonedx.json" \
        "sbom-spdx.json" \
        "SHA256SUMS.txt"; do
        echo "⬇️ Téléchargement $F..."
        curl -fsSL "$BASE/$F" -o "github_assets/$F" && echo "✅ $F récupéré" || echo "⚠️ $F pas encore disponible"
      done
    - 'echo "📦 Inventaire complet des binaires rapatriés :"'
    - ls -lh github_assets/
  artifacts:
    paths:
      - github_assets/
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
    - when: manual
      allow_failure: true


# === STAGE: RELEASE ===
release_gitlab:
  stage: release
  needs: []
  allow_failure: true
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Creating GitLab Release for $CI_COMMIT_TAG"
    - apk add --no-cache git curl
    - |
      echo "⏳ Waiting for GitHub Actions multi-OS binaries to be published..."
      for i in $(seq 1 60); do
        if curl -sL -I "https://github.com/TUTODECODE-FR/T2DECODE/releases/download/${CI_COMMIT_TAG}/T2DECODE-macOS.dmg" | grep -E "HTTP/[12] (200|302)" >/dev/null 2>&1; then
          echo "✅ GitHub Release binaries are fully compiled and live!"
          break
        fi
        echo "Binaries still compiling on GitHub Actions. Waiting 10s ($i/60)..."
        sleep 10
      done
    - |
      PREV_TAG=$(git describe --tags --abbrev=0 ${CI_COMMIT_TAG}^ 2>/dev/null || echo "")
      if [ -n "$PREV_TAG" ]; then
        CHANGELOG=$(git log --oneline --no-merges ${PREV_TAG}..${CI_COMMIT_TAG} | sed 's/^/- /')
      else
        CHANGELOG=$(git log --oneline --no-merges -n 5 | sed 's/^/- /')
      fi
      if [ -z "$CHANGELOG" ]; then
        CHANGELOG="- Release $CI_COMMIT_TAG update"
      fi
      RELEASE_DESC="## 🚀 Nouveautés & Modifications ($CI_COMMIT_TAG)\n\n$CHANGELOG"
    - |
      release-cli create --name "Release $CI_COMMIT_TAG" \
        --tag-name "$CI_COMMIT_TAG" \
        --description "$RELEASE_DESC" \
        --assets-link "{\"name\":\"T2DECODE-Android-armeabi-v7a.apk\",\"url\":\"https://github.com/TUTODECODE-FR/T2DECODE/releases/download/${CI_COMMIT_TAG}/app-armeabi-v7a-release.apk\"}" \
        --assets-link "{\"name\":\"T2DECODE-Android-arm64-v8a.apk\",\"url\":\"https://github.com/TUTODECODE-FR/T2DECODE/releases/download/${CI_COMMIT_TAG}/app-arm64-v8a-release.apk\"}" \
        --assets-link "{\"name\":\"T2DECODE-Android-x86_64.apk\",\"url\":\"https://github.com/TUTODECODE-FR/T2DECODE/releases/download/${CI_COMMIT_TAG}/app-x86_64-release.apk\"}" \
        --assets-link "{\"name\":\"T2DECODE-Linux.tar.gz\",\"url\":\"https://github.com/TUTODECODE-FR/T2DECODE/releases/download/${CI_COMMIT_TAG}/T2DECODE-Linux.tar.gz\"}" \
        --assets-link "{\"name\":\"T2DECODE-Windows.zip\",\"url\":\"https://github.com/TUTODECODE-FR/T2DECODE/releases/download/${CI_COMMIT_TAG}/T2DECODE-Windows.zip\"}" \
        --assets-link "{\"name\":\"T2DECODE-macOS.dmg\",\"url\":\"https://github.com/TUTODECODE-FR/T2DECODE/releases/download/${CI_COMMIT_TAG}/T2DECODE-macOS.dmg\"}" \
        --assets-link "{\"name\":\"SHA256SUMS.txt\",\"url\":\"https://github.com/TUTODECODE-FR/T2DECODE/releases/download/${CI_COMMIT_TAG}/SHA256SUMS.txt\"}" || true
  rules:
    - if: $CI_COMMIT_TAG

publish_sourceforge:
  stage: release
  allow_failure: true
  image: alpine:3.16
  needs:
    - job: sync_github_multi_os_builds
      artifacts: true
      optional: true
  script:
    - apk add --no-cache openssh-client rsync curl
    - |
      if [ -z "$SF_PRIVATE_KEY" ] || [ -z "$SF_USER" ]; then
        echo "SourceForge credentials not configured. Skipping upload."
        exit 0
      fi
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - |-
      printf '%s\n' "$SF_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/sf_key
    - chmod 600 ~/.ssh/sf_key
    - ssh-keyscan frs.sourceforge.net >> ~/.ssh/known_hosts 2>/dev/null
    - mkdir -p sf_assets
    - find . -maxdepth 4 \( -name "*.apk" -o -name "*.aab" -o -name "*.dmg" -o -name "*.pkg" -o -name "*.exe" -o -name "*.AppImage" -o -name "T2DECODE-Linux.tar.gz" -o -name "T2DECODE-Windows.zip" -o -name "T2DECODE-macOS.zip" \) -exec cp {} sf_assets/ \;
    - |
      if [ -z "$(ls -A sf_assets 2>/dev/null)" ]; then
        TAG="${CI_COMMIT_TAG:-${DEPLOY_TAG}}"
        if [ -z "$TAG" ]; then
          TAG="v$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)"
        fi
        echo "No local artifacts. Downloading from GitHub Releases for $TAG..."
        BASE="https://github.com/TUTODECODE-FR/T2DECODE/releases/download/${TAG}"
        for F in \
          "app-arm64-v8a-release.apk" \
          "app-armeabi-v7a-release.apk" \
          "app-x86_64-release.apk" \
          "T2DECODE-${TAG}-release.apk" \
          "T2DECODE-macOS.dmg" \
          "T2DECODE-macOS.zip" \
          "T2DECODE-Windows.zip" \
          "T2DECODE-Linux.tar.gz" \
          "T2DECODE-Linux.AppImage" \
          "SHA256SUMS.txt"; do
          curl -fsSL "$BASE/$F" -o "sf_assets/$F" && echo "Downloaded $F" || true
        done
      fi
    - ls -la sf_assets/
    - |
      DEST="${CI_COMMIT_TAG:-${DEPLOY_TAG:-v$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)}}"
      rsync -e "ssh -i ~/.ssh/sf_key -o StrictHostKeyChecking=yes" -avP sf_assets/ $SF_USER@frs.sourceforge.net:/home/frs/project/$SF_PROJECT/${DEST}/ || true
  rules:
    - if: $CI_COMMIT_TAG && $SF_PRIVATE_KEY && $SF_USER
      when: on_success
    - when: manual
      allow_failure: true

publish_homebrew_tap:
  stage: release
  allow_failure: true
  image: alpine:latest
  script:
    - apk add --no-cache git curl
    - |
      if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
        echo "Error: HOMEBREW_TAP_TOKEN is not set. Skipping Homebrew Tap update."
        exit 0
      fi
    - chmod +x scripts/update_homebrew_cask.sh
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      # Downloads a real DMG (GitLab package, GitHub release, then SourceForge)
      # and refuses HTML error pages before writing the cask.
      scripts/update_homebrew_cask.sh "$VERSION" /tmp/t2decode.rb
    - git clone "https://oauth2:${HOMEBREW_TAP_TOKEN}@gitlab.com/tutodecode-org/homebrew-tap.git" /tmp/homebrew-tap || { echo "Failed to clone homebrew-tap"; exit 0; }
    - mkdir -p /tmp/homebrew-tap/Casks
    - cp /tmp/t2decode.rb /tmp/homebrew-tap/Casks/t2decode.rb
    - cd /tmp/homebrew-tap
    - git config user.name "gitlab-ci[bot]"
    - git config user.email "gitlab-ci[bot]@tutodecode.org"
    - git add Casks/t2decode.rb
    - |
      if git diff-index --quiet HEAD --; then
        echo "No changes to commit for Homebrew Tap."
      else
        git commit -m "chore: update t2decode cask to version $VERSION [skip ci]"
        git push origin main || git push origin master || true
      fi
  rules:
    - if: $CI_COMMIT_TAG
      when: manual

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Code-Quality.gitlab-ci.yml
