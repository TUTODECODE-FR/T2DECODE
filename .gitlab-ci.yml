# CI T2DECODE — Validation des assets .tdc et cohérence des checksums

stages:
  - validate
  - build

variables:
  TDC_FILES: "assets/courses.tdc assets/cheat_sheets.tdc assets/netkit_cheat_sheets.tdc"

validate_tdc:
  stage: validate
  image: python:3.11-slim
  script:
    - python3 scripts/validate_tdc.py $TDC_FILES
  only:
    - merge_requests
    - main
    - develop

check_checksums:
  stage: validate
  image: python:3.11-slim
  script:
    - python3 scripts/generate_checksums.py
    - git diff --exit-code assets/asset_checksums.json
  only:
    - merge_requests
    - main

build_android:
  stage: build
  image: ghcr.io/cirruslabs/flutter:stable
  script:
    - flutter pub get
    - flutter build apk --release
  only:
    - main
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/
