# Miroir du code vers GitLab à chaque push sur main et à chaque tag.
# GitHub est la source : tout se fait ici, GitLab reçoit une copie.
# Requiert : secret GITLAB_TOKEN (write_repository) ; variable GITLAB_PROJECT facultative.
name: Miroir GitLab

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-gitlab
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      GITLAB_PROJECT: ${{ vars.GITLAB_PROJECT || 'tutodecode-org/T2DECODE' }}
    steps:
      - name: GitLab configuré ?
        id: cfg
        run: |
          if [ -n "$GITLAB_TOKEN" ]; then echo "on=1" >> "$GITHUB_OUTPUT";
          else echo "::notice::GITLAB_TOKEN / GITLAB_PROJECT absents : miroir ignoré"; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.cfg.outputs.on
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Push vers GitLab
        if: steps.cfg.outputs.on
        run: |
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.com/${GITLAB_PROJECT}.git"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            git push gitlab "refs/tags/${GITHUB_REF_NAME}"
          else
            git push gitlab "HEAD:refs/heads/main"
          fi
