name: Release & Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-linux:
    name: Build Android & Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Android Signing Key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build Android Release APKs
        run: flutter build apk --release --split-per-abi

      - name: Build Linux Release
        run: |
          flutter build linux --release
          tar -czvf T2DECODE-Linux.tar.gz -C build/linux/x64/release/bundle/ .

      - name: Upload Android & Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-android-linux
          path: |
            build/app/outputs/flutter-apk/*.apk
            T2DECODE-Linux.tar.gz

  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Archive Windows Release
        shell: powershell
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath T2DECODE-Windows.zip

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-windows
          path: T2DECODE-Windows.zip

  build-macos:
    name: Build macOS Desktop
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Create DMG & ZIP Packages
        run: |
          chmod +x scripts/build_dmg.sh
          ./scripts/build_dmg.sh
          cp -f build/macos/Build/Products/Release/T2DECODE-macOS.dmg T2DECODE-macOS.dmg
          ditto -c -k --keepParent build/macos/Build/Products/Release/T2DECODE.app T2DECODE-macOS.zip

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-macos
          path: |
            T2DECODE-macOS.dmg
            T2DECODE-macOS.zip

  publish-release:
    name: Publish Multi-OS GitHub Release
    needs: [build-android-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Android & Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts-android-linux
          path: ./release_assets

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts-windows
          path: ./release_assets

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts-macos
          path: ./release_assets

      - name: Prepare Assets & Generate SHA256SUMS.txt
        run: |
          cd release_assets
          # Flatten nested files (e.g. build/app/outputs/flutter-apk/*.apk -> ./)
          find . -type f ! -name "SHA256SUMS.txt" -exec cp -f {} . \;
          # Remove subdirectories
          find . -mindepth 1 -type d -exec rm -rf {} +
          # Generate checksums for all regular files
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release with All OS Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          name: Release ${{ github.ref_name }}
          body: |
            ## 🛡️ T2DECODE — Release ${{ github.ref_name }}

            Plateforme d'apprentissage technique et de cybersécurité 100% locale, sans cloud, sans tracking.

            ### 📦 Binaires Multi-OS Inclus
            - 🤖 **Android** : APK arm64-v8a, armeabi-v7a, x86_64
            - 🐧 **Linux** : Archive 64-bit (`T2DECODE-Linux.tar.gz`)
            - 🪟 **Windows** : Exécutable Desktop (`T2DECODE-Windows.zip`)
            - 🍏 **macOS** : Image disque universelle (`T2DECODE-macOS.dmg`)
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to SourceForge
        if: env.SF_PRIVATE_KEY != ''
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SF_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/sf_key
          chmod 600 ~/.ssh/sf_key
          ssh-keyscan frs.sourceforge.net >> ~/.ssh/known_hosts 2>/dev/null
          rsync -e "ssh -i ~/.ssh/sf_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" -avP release_assets/ winancher@frs.sourceforge.net:/home/frs/project/t2decode/${{ github.ref_name }}/ || true
        env:
          SF_PRIVATE_KEY: ${{ secrets.SF_PRIVATE_KEY }}

