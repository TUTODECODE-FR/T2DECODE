name: Release & Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-linux:
    name: Build Android & Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.1' # = .flutter-version

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Android Signing Key
        run: |
          # Sans clé stable, Gradle signe avec une clé debug jetable (différente à chaque run) :
          # les mises à jour Android (Obtainium, installation par-dessus) échouent. On refuse.
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 absent : APK non publiable (signature debug)."
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build Android Release APKs
        run: flutter build apk --release --split-per-abi

      - name: Verify Android signature is not a debug key
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            certs=$("$apksigner" verify --print-certs "$apk")
            echo "$certs" | grep -E 'DN|SHA-256'
            if echo "$certs" | grep -q 'CN=Android Debug'; then
              echo "::error::$apk est signé avec une clé debug."
              exit 1
            fi
          done

      - name: Build Linux Release
        run: |
          flutter build linux --release
          tar -czvf T2DECODE-Linux.tar.gz -C build/linux/x64/release/bundle/ .

      - name: Upload Android & Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-android-linux
          path: |
            build/app/outputs/flutter-apk/*.apk
            T2DECODE-Linux.tar.gz

  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest
    environment: signature-windows # sujet OIDC fixe (accès fédéré Entra), limité à main et v* dans les réglages
    permissions:
      contents: read
      id-token: write # jeton OIDC pour azure/login
    env:
      AZURE_SIGN_ON: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.1' # = .flutter-version

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      # Runtime Visual C++ livré à côté de l'exe (déploiement local autorisé par Microsoft) :
      # sans lui, un Windows neuf affiche « MSVCP140.dll est introuvable ». Pas besoin d'admin.
      - name: Runtime Visual C++ (DLL locales)
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT" -Directory | Sort-Object FullName | Select-Object -Last 1
          if (-not $crt) { throw "Dossier Microsoft.VC14x.CRT introuvable" }
          $dest = "build\windows\x64\runner\Release"
          # toutes les DLL du runtime (msvcp140*, vcruntime140*, concrt140, vccorlib140)
          Copy-Item (Join-Path $crt.FullName "*.dll") $dest -Force
          foreach ($d in "msvcp140.dll", "msvcp140_1.dll", "msvcp140_2.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            if (-not (Test-Path (Join-Path $dest $d))) { throw "$d manquante" }
          }
          Get-ChildItem $dest -Filter *.dll | Select-Object Name, Length | Format-Table | Out-String | Write-Host
          "Runtime VC++ : $($crt.FullName)" >> $env:GITHUB_STEP_SUMMARY

      - name: Windows non signé
        if: env.AZURE_SIGN_ON != 'true'
        shell: pwsh
        run: |
          Write-Output "::warning::AZURE_SIGNING_ACCOUNT absent : exécutables Windows NON signés (alerte SmartScreen)"

      - name: Connexion Azure (OIDC)
        if: env.AZURE_SIGN_ON == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true # le principal n'a de rôle que sur le compte de signature

      - name: Signer l'application (avant zip et installateur)
        if: env.AZURE_SIGN_ON == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\build\windows\x64\runner\Release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: T2DECODE
          description-url: https://github.com/TUTODECODE-FR/T2DECODE
          # seule la session ouverte par azure/login sert
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Archive Windows Release
        shell: powershell
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath T2DECODE-Windows.zip

      - name: Installateur Windows (Inno Setup)
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          if ($ref -match '^v(\d+\.\d+\.\d+(\.\d+)?)$') { $ver = $Matches[1] }
          else { $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DMyAppVersion=$ver" windows\installer\tutodecode.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item windows\installer\T2DECODE-Setup.exe T2DECODE-Windows-Setup.exe
          "Installateur T2DECODE $ver" >> $env:GITHUB_STEP_SUMMARY
          New-Item -ItemType Directory setup | Out-Null
          Copy-Item T2DECODE-Windows-Setup.exe setup/

      - name: Signer l'installateur
        if: env.AZURE_SIGN_ON == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\setup
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: T2DECODE
          description-url: https://github.com/TUTODECODE-FR/T2DECODE
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Vérifier les signatures
        if: env.AZURE_SIGN_ON == 'true'
        shell: pwsh
        run: |
          Copy-Item setup/T2DECODE-Windows-Setup.exe . -Force
          $bad = 0
          foreach ($f in @(Get-ChildItem build/windows/x64/runner/Release -Filter *.exe) + @(Get-Item T2DECODE-Windows-Setup.exe)) {
            $s = Get-AuthenticodeSignature $f.FullName
            "$($f.Name) : $($s.Status) — $($s.SignerCertificate.Subject)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
            if ($s.Status -ne 'Valid' -or -not $s.TimeStamperCertificate) { $bad++ }
          }
          if ($bad) { Write-Error "$bad exécutable(s) mal signé(s) ou sans horodatage"; exit 1 }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-windows
          path: |
            T2DECODE-Windows-Setup.exe
            T2DECODE-Windows.zip

  build-macos:
    name: Build macOS Desktop
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.1' # = .flutter-version

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Signature Developer ID + notarisation Apple
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_CERT_IDENTITY: ${{ secrets.MACOS_CERT_IDENTITY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          SIGN_REQUIRED: ${{ vars.MACOS_SIGN_REQUIRED || '0' }}
        run: bash scripts/apple/developer-id-sign.sh app build/macos/Build/Products/Release/T2DECODE.app

      - name: Create DMG & ZIP Packages
        run: |
          brew install create-dmg
          bash scripts/build_dmg.sh
          cp -f build/macos/Build/Products/Release/T2DECODE-macOS.dmg T2DECODE-macOS.dmg
          ditto -c -k --keepParent build/macos/Build/Products/Release/T2DECODE.app T2DECODE-macOS.zip

      - name: Signature + notarisation de l'image DMG
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_CERT_IDENTITY: ${{ secrets.MACOS_CERT_IDENTITY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          SIGN_REQUIRED: ${{ vars.MACOS_SIGN_REQUIRED || '0' }}
        run: bash scripts/apple/developer-id-sign.sh dmg T2DECODE-macOS.dmg

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-macos
          path: |
            T2DECODE-macOS.dmg
            T2DECODE-macOS.zip

  publish-release:
    name: Publish Multi-OS GitHub Release
    needs: [build-android-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      SF_ON: ${{ secrets.SF_PRIVATE_KEY != '' }}
    steps:
      - name: Checkout repository # scripts/generate_sbom.py, pubspec
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download Android & Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts-android-linux
          path: ./release_assets

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts-windows
          path: ./release_assets

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts-macos
          path: ./release_assets

      - name: Generate CycloneDX & SPDX SBOMs
        run: |
          python3 scripts/generate_sbom.py
          cp -f sbom-cyclonedx.json release_assets/
          cp -f sbom-spdx.json release_assets/

      - name: Prepare Assets & Generate SHA256SUMS.txt
        run: |
          cd release_assets
          # Flatten nested files (e.g. build/app/outputs/flutter-apk/*.apk -> ./)
          find . -type f ! -name "SHA256SUMS.txt" -exec cp -f {} . \;
          # Remove subdirectories
          find . -mindepth 1 -type d -exec rm -rf {} +
          # Generate checksums for all regular files
          sha256sum $(ls -1 | grep -v SHA256SUMS.txt) > SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: release_assets/*

      - name: Note de version (message du tag)
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          ref=$(gh api "repos/$REPO/git/ref/tags/$TAG" 2>/dev/null || true)
          msg=""
          if [ "$(jq -r '.object.type // ""' <<<"$ref")" = tag ]; then
            msg=$(gh api "repos/$REPO/git/tags/$(jq -r .object.sha <<<"$ref")" -q .message)
            msg=${msg#T2DECODE * : }
          fi
          { echo "text<<FIN_NOTES"; printf '%s\n' "$msg"; echo "FIN_NOTES"; } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with All OS Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          name: Release ${{ github.ref_name }}
          body: |
            ## T2DECODE ${{ github.ref_name }}

            ${{ steps.notes.outputs.text }}

            Application libre pour apprendre les réseaux, la cybersécurité et l'administration système, entièrement hors ligne, sans compte ni pistage.

            ### Téléchargements
            - Windows : installateur `T2DECODE-Windows-Setup.exe` ou version portable `T2DECODE-Windows.zip`, signés par l'association TUTODECODE.
            - macOS : `T2DECODE-macOS.dmg`, signé et notarisé par Apple. Ouvrir l'image et glisser T2DECODE dans Applications.
            - Linux : `T2DECODE-Linux.tar.gz`, ou `sudo snap install t2decode`.
            - Android : APK arm64-v8a, armeabi-v7a et x86_64, ou F-Droid.

            ### Vérifications faites par la CI sur cette version
            - tests unitaires et d'interface ;
            - analyse statique (`flutter analyze`, Semgrep) ;
            - recherche de secrets (Gitleaks) ;
            - vulnérabilités des dépendances (OSV-Scanner) ;
            - analyse antivirus (ClamAV).

            Empreintes SHA-256 de tous les fichiers : `SHA256SUMS.txt`.
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to SourceForge
        if: env.SF_ON == 'true'
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SF_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/sf_key
          chmod 600 ~/.ssh/sf_key
          ssh-keyscan frs.sourceforge.net >> ~/.ssh/known_hosts 2>/dev/null
          # échec signalé (avertissement) sans bloquer la release ni la recopie GitLab
          if ! rsync -e "ssh -i ~/.ssh/sf_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes" -av release_assets/ winancher@frs.sourceforge.net:/home/frs/project/t2decode/${{ github.ref_name }}/; then
            echo "::warning::SourceForge : envoi refusé (clé SSH SF_PRIVATE_KEY absente du compte SourceForge ?)"
          fi
        env:
          SF_PRIVATE_KEY: ${{ secrets.SF_PRIVATE_KEY }}

  # GitHub produit et signe ; GitLab reçoit les mêmes fichiers (sommes vérifiées).
  gitlab:
    name: Recopie de la release sur GitLab
    needs: publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      GITLAB_PROJECT: ${{ vars.GITLAB_PROJECT || 'tutodecode-org/T2DECODE' }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: GitLab configuré ?
        id: cfg
        run: |
          if [ -n "$GITLAB_TOKEN" ]; then echo "on=1" >> "$GITHUB_OUTPUT";
          else echo "::notice::GITLAB_TOKEN absent : release GitLab ignorée"; fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.cfg.outputs.on
        with:
          name: release-files
          path: out
      - name: Sommes de contrôle
        if: steps.cfg.outputs.on
        working-directory: out
        run: sha256sum -c SHA256SUMS.txt
      - name: Fichiers → registre GitLab + release
        if: steps.cfg.outputs.on
        run: |
          set -euo pipefail
          api="https://gitlab.com/api/v4/projects/$(jq -rn --arg p "$GITLAB_PROJECT" '$p|@uri')"
          ver="${TAG#v}"
          links="[]"
          for f in out/*; do
            name=$(basename "$f")
            url="$api/packages/generic/t2decode/$ver/$name"
            curl -fsS --retry 3 -H "PRIVATE-TOKEN: $GITLAB_TOKEN" --upload-file "$f" "$url" >/dev/null
            links=$(jq -c --arg n "$name" --arg u "$url" '. + [{name:$n, url:$u, link_type:"package"}]' <<<"$links")
            echo "↑ $name"
          done
          notes=""
          ref=$(GH_TOKEN="$GH_TOKEN" gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" 2>/dev/null || true)
          if [ "$(jq -r '.object.type // ""' <<<"$ref")" = tag ]; then
            notes=$(GH_TOKEN="$GH_TOKEN" gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r .object.sha <<<"$ref")" -q .message)
            notes=${notes#T2DECODE * : }
          fi
          desc="Fichiers générés et signés par GitHub Actions, recopiés ici à l'identique (SHA256SUMS.txt)."
          [ -z "$notes" ] || desc=$(printf '%s\n\n%s' "$notes" "$desc")
          body=$(jq -n --arg tag "$TAG" --arg desc "$desc" --argjson links "$links" \
            '{tag_name:$tag, name:("T2DECODE " + $tag), description:$desc, assets:{links:$links}}')
          code=$(curl -s -o /tmp/r.json -w '%{http_code}' -H "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            -H "Content-Type: application/json" -X POST "$api/releases" -d "$body")
          if [ "$code" = 409 ]; then
            # release déjà créée (par la CI GitLab) : liens ajoutés sous un nom distinct
            jq -c '.[] | .name += " (copie GitLab)"' <<<"$links" | while IFS= read -r row; do
              curl -s -o /dev/null -H "PRIVATE-TOKEN: $GITLAB_TOKEN" -H "Content-Type: application/json" \
                -X POST "$api/releases/$TAG/assets/links" -d "$row" || true
            done
          elif [ "${code:0:1}" != 2 ]; then
            cat /tmp/r.json; exit 1
          fi

  # Homebrew : met à jour le cask du tap tutodecode-org/homebrew-tap (GitLab).
  # Empreinte prise dans SHA256SUMS.txt de la release et revérifiée sur le DMG téléchargé.
  # Secret : HOMEBREW_TAP_TOKEN (jeton du projet homebrew-tap, droit write_repository).
  homebrew:
    name: Homebrew (cask t2decode)
    needs: publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
    steps:
      - name: Mise à jour du cask
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN absent : cask Homebrew non mis à jour"; exit 0
          fi
          [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?)$ ]] || { echo "::notice::tag $TAG non publié sur Homebrew"; exit 0; }
          ver="${BASH_REMATCH[1]}"
          base="https://github.com/$REPO/releases/download/$TAG"
          curl -fsSL --retry 5 -o SHA256SUMS.txt "$base/SHA256SUMS.txt"
          curl -fsSL --retry 5 -o T2DECODE-macOS.dmg "$base/T2DECODE-macOS.dmg"
          sha256sum -c --ignore-missing SHA256SUMS.txt
          sha=$(awk '$2=="T2DECODE-macOS.dmg"{print $1}' SHA256SUMS.txt)
          [ ${#sha} = 64 ] || { echo "::error::empreinte du DMG introuvable"; exit 1; }
          git clone -q "https://oauth2:${HOMEBREW_TAP_TOKEN}@gitlab.com/tutodecode-org/homebrew-tap.git" tap
          cat > tap/Casks/t2decode.rb <<CASK
          cask "t2decode" do
            version "$ver"
            sha256 "$sha"

            url "https://github.com/$REPO/releases/download/v#{version}/T2DECODE-macOS.dmg"
            name "T2DECODE"
            desc "Offline simulator and toolkit for networking and cybersecurity"
            homepage "https://tutodecode.org/"

            livecheck do
              url :url
              strategy :github_latest
            end

            app "T2DECODE.app"

            zap trash: [
              "~/Library/Application Support/org.t2decode.app",
              "~/Library/Preferences/org.t2decode.app.plist",
              "~/Library/Saved Application State/org.t2decode.app.savedState",
            ]
          end
          CASK
          cd tap
          git config user.name "TUTODECODE CI"; git config user.email "contact@tutodecode.org"
          git add Casks/t2decode.rb
          if git diff --cached --quiet; then echo "cask déjà à jour"; exit 0; fi
          git commit -qm "chore: t2decode $ver"
          git push -q origin HEAD
          echo "Homebrew : t2decode $ver" >> "$GITHUB_STEP_SUMMARY"

  # winget : soumet la version à microsoft/winget-pkgs (PR automatique, validée par Microsoft).
  # Secret : WINGET_TOKEN (jeton GitHub classique, droit public_repo, pour la PR depuis un fork).
  winget:
    name: winget (TUTODECODE.T2DECODE)
    needs: publish-release
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
    steps:
      - name: Soumission
        shell: pwsh
        run: |
          if (-not $env:WINGET_TOKEN) { "::notice::WINGET_TOKEN absent : winget non soumis"; exit 0 }
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+(\.\d+)?)$') { "::notice::tag $env:TAG non soumis à winget"; exit 0 }
          $ver = $Matches[1]
          $base = "https://github.com/$env:REPO/releases/download/$env:TAG"
          Invoke-WebRequest "$base/SHA256SUMS.txt" -OutFile SHA256SUMS.txt
          $line = Select-String -Path SHA256SUMS.txt -Pattern 'T2DECODE-Windows-Setup\.exe$'
          if (-not $line) { "::warning::pas d'installateur Windows dans cette release : winget ignoré"; exit 0 }
          $sha = ($line.Line -split '\s+')[0].ToUpper()
