Builds:
  - versionName: 1.0.3
    versionCode: 351
    commit: a324b17fd93797f7971b2096562b18787211111f
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - flutterVersion="$(cat .flutter-version)"
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - find .pub-cache -type d -name "_out" -exec rm -rf {} + || true
      - find .pub-cache -name "*.bin" -delete || true
      - find .pub-cache -name "*.zip" -delete || true
      - find .pub-cache -name "*.gz" -delete || true
      - find .pub-cache -name "*.wasm" -delete || true
      - find .pub-cache -name "*.exe" -delete || true
    scanignore:
      - .pub-cache
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export FDROID_BUILD=true
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"

