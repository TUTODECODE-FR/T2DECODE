name: t2decode
version: '1.0.3'
summary: Boite a outils et cours hors-ligne pour la cybersecurite et les reseaux
description: |
  T2DECODE est une plateforme d'apprentissage hors-ligne et souveraine pour la cybersecurite, les reseaux et l'administration systeme.

confinement: strict
base: core22
grade: stable

architectures:
  - build-on: [amd64]
    run-on: [amd64]
  - build-on: [arm64]
    run-on: [arm64]

apps:
  t2decode:
    command: T2DECODE
    plugs:
      - network
      - network-bind
      - desktop
      - x11

parts:
  t2decode:
    plugin: dump
    source: .
    build-packages:
      - git
      - curl
      - unzip
      - build-essential
      - clang
      - cmake
      - ninja-build
      - pkg-config
      - libgtk-3-dev
      - liblzma-dev
      - libsecret-1-dev
    stage-packages:
      - libgtk-3-0
      - libglib2.0-0
      - libsecret-1-0
      - libx11-6
      - libxcursor1
      - libxinerama1
      - libxrandr2
      - libxi6
      - libepoxy0
      - liblzma5
    override-build: |
      git clone https://github.com/flutter/flutter.git -b stable /tmp/flutter || true
      git config --global --add safe.directory '*' || true
      export PATH="/tmp/flutter/bin:$PATH"
      flutter config --no-analytics || true
      flutter pub get
      flutter build linux --release
      mkdir -p $CRAFT_PART_INSTALL
      cp -r build/linux/*/release/bundle/* $CRAFT_PART_INSTALL/
