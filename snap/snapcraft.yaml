name: t2decode
version: '1.0.2.4'
summary: Simulateur et boite a outils hors-ligne pour les reseaux et la cybersecurite
description: |
  T2DECODE est une plateforme d'apprentissage hors-ligne pour la cybersecurite et les reseaux.

confinement: strict
base: core22
grade: stable

apps:
  t2decode:
    command: T2DECODE
    extensions: [gnome]
    plugs:
      - network
      - network-bind
      - desktop
      - x11

parts:
  t2decode:
    plugin: dump
    source: .
    build-packages:
      - git
      - curl
      - unzip
      - build-essential
      - clang
      - cmake
      - ninja-build
      - pkg-config
      - libgtk-3-dev
      - liblzma-dev
      - libsecret-1-dev
    stage-packages:
      - libgtk-3-0
      - libglib2.0-0
      - libsecret-1-0
      - libx11-6
      - libxcursor1
      - libxinerama1
      - libxrandr2
      - libxi6
      - libepoxy0
      - liblzma5
    override-build: |
      git clone https://github.com/flutter/flutter.git -b stable /tmp/flutter
      export PATH="/tmp/flutter/bin:$PATH"
      flutter config --no-enable-swift-package-manager
      flutter pub get
      flutter build linux --release
      mkdir -p $CRAFT_PART_INSTALL
      cp -r build/linux/x64/release/bundle/* $CRAFT_PART_INSTALL/
